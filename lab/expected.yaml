# Expected results of the lab scans, written by hand from spec 9.3 (not generated by product code).
# Keys are named by their file in lab/keys/ (k_ops -> lab/keys/k_ops.pub); fingerprints are computed
# by the test from those files.

hosts:   # name -> container addresses (lab-control sshd on port 2200 of the first address)
  jump: [172.30.1.5, 172.30.2.5]
  a1: [172.30.1.11]
  a2: [172.30.1.12]
  a3: [172.30.1.13]
  a4: [172.30.1.14]
  a5: [172.30.1.15]
  b1: [172.30.2.11]
  b2: [172.30.2.12]
  b3: [172.30.2.13, 172.30.3.13]
  b4: [172.30.2.14]
  b5: [172.30.2.15]
  c1: [172.30.3.21]
  c2: [172.30.3.22]

keys:
  K_OPS: k_ops
  K_FLEET: k_fleet
  K_DEPLOY: k_deploy
  K_DSA: k_dsa
  K_BACKUP: k_backup
  K_MON: k_mon
  K_BRIDGE: k_bridge
  K_DUP: k_dup
  K_ORPHAN: k_orphan
  K_CA: k_ca
  K_CAROL: k_carol
  K_NEW: k_new
  AUDIT: audit_ed25519

scan1:
  # host: [status, privilege, depth, discovered via "parent file:line" or "entry", route]
  hosts:
    jump: [ok, root, 0, entry, [jump]]
    a1: [ok, root, 1, "jump /home/ops/.ssh/config:2", [jump, a1]]
    b1: [ok, root, 1, "jump /home/ops/.ssh/config:4", [jump, b1]]
    a2: [ok, root, 2, "a1 /home/deploy/.ssh/known_hosts:1", [jump, a2]]
    a3: [ok, root, 2, "a1 /home/deploy/.ssh/config:1", [jump, a3]]
    b2: [ok, root, 2, "b1 /home/admin/.ssh/known_hosts:1", [jump, b2]]
    b3: [ok, root, 2, "b1 /home/admin/.ssh/known_hosts:2", [jump, b3]]
    b5: [partial, unprivileged, 2, "b1 /home/admin/.ssh/config:1", [jump, b5]]
    a4: [ok, sudo_password, 3, "a2 /home/deploy/.ssh/config:2", [jump, a4]]
    a5: [ok, root, 3, "a3 /home/app/.ssh/config:1", [jump, a5]]
    c1: [ok, root, 3, "b3 /home/ops2/.ssh/config:2", [jump, b3, c1]]
    172.30.1.99: [unreachable, null, 3, "a2 /home/deploy/.ssh/known_hosts:1", null]
    c2: [ok, root, 4, "c1 /root/.ssh/known_hosts:1", [jump, b3, c1, c2]]
  a2_discovered_source: known_hosts_hashed
  c1_failed_attempt: [jump, c1]
  unreachable_attempts: [[jump, 172.30.1.99], [jump, a2, 172.30.1.99]]
  # value -> outcome (and for alias: of which host)
  references:
    203.0.113.10: out_of_scope
    10.20.30.40: out_of_scope
    172.30.2.14: excluded
    git.example.com: unresolvable
  aliases:   # [from host, value] -> alias of
    - [a1, 172.30.1.5, jump]
    - [b1, 172.30.2.5, jump]
  already:   # a5 alice's `db` HostName and its ProxyJump
    - [a5, 172.30.2.12]
    - [a5, 172.30.1.11]
  unresolved_hashed: {a1: 1}
  # the entry plus 12 hosts reached through it: 11 ok/partial, 1 unreachable
  connected_via_entry: 12
  connected_ok_partial_via_entry: 11
  access_edges:
    total: 20
    effective: 19
    unknown_origin: 3
    list:   # [src host:user or "unknown", dst host:user, key, status, [flags that must be present], effective]
      - [jump:ops, a1:deploy, K_OPS, confirmed, [], 1]
      - [jump:ops, b1:admin, K_OPS, restricted_ok, [], 1]
      - [jump:ops, a1:root, K_FLEET, confirmed, [dst_root], 1]
      - [jump:ops, a2:root, K_FLEET, confirmed, [dst_root], 1]
      - [jump:ops, a3:root, K_FLEET, confirmed, [dst_root], 1]
      - [jump:ops, a5:root, K_FLEET, confirmed, [dst_root], 1]
      - [jump:ops, b1:root, K_FLEET, confirmed, [dst_root], 1]
      - [jump:ops, b2:root, K_FLEET, confirmed, [dst_root], 1]
      - [jump:ops, b3:root, K_FLEET, confirmed, [dst_root], 1]
      - [a1:deploy, a2:deploy, K_DEPLOY, confirmed, [], 1]
      - [a1:deploy, a3:app, K_DEPLOY, confirmed, [], 1]
      - [unknown, b1:root, K_DSA, unknown_origin, [], 1]
      - [unknown, a4:root, K_DSA, unknown_origin, [], 1]
      - [b2:www, a2:backup, K_BACKUP, confirmed, [dst_nologin, forced_command], 1]
      - [a3:monitor, b2:monitor, K_MON, restricted_blocked, [], 0]
      - [b3:ops2, c1:svc, K_BRIDGE, confirmed, [], 1]
      - [b3:ops2, c2:svc, K_BRIDGE, confirmed, [], 1]
      - [a5:alice, b2:alice, K_DUP, confirmed, [], 1]
      - [a5:bob, b2:alice, K_DUP, confirmed, [], 1]
      - [unknown, c1:root, K_ORPHAN, unknown_origin, [], 1]
    no_edges_for: [K_CA, K_CAROL, AUDIT]
  evidence_edges:   # [src host:user ('' = system), dst host, source]
    - [jump:ops, a1, ssh_config]
    - [a1:deploy, a2, known_hosts_hashed]
    - ["a3:", a1, system_known_hosts]
    - [b3:ops2, c1, ssh_config]
    - [c1:root, c2, known_hosts]
    - [a5:alice, a1, ssh_config_proxyjump]
  metrics:
    out_hosts: {jump: 7, a1: 2, b3: 2, b2: 1, a5: 1, a3: 0}
    in_hosts: {a2: 3, a3: 2, b2: 2, a1: 1, b1: 1, b3: 1, a5: 1, c1: 1, c2: 1, a4: 0}
    in_unknown_keys: {b1: 1, a4: 1, c1: 1}
    top_outbound: jump
    top_inbound: a2
  findings:
    key_strength_critical: 4
    key_strength_weak: 3
    root_authorized_key: 10
    key_on_many_hosts: 1
    key_unknown_origin: 3
    private_key_unencrypted: 7
    private_key_bad_permissions: 1
    duplicate_key_across_users: 1
    key_for_disabled_user: 1
    permit_root_login_yes: 1
    password_authentication_yes: 1
    known_host_stale: 1
    host_unreachable: 1
    partial_scan: 1
    cert_authority_trusted: 1
    host_key_changed: 0
  finding_where:   # rule -> [host, user, key or path]
    key_strength_critical:
      - [b1, root, K_DSA]
      - [a4, root, K_DSA]
      - [a2, backup, K_BACKUP]
      - [b2, www, /home/www/.ssh/backup_rsa]
    key_strength_weak:
      - [a2, deploy, K_DEPLOY]
      - [a3, app, K_DEPLOY]
      - [a1, deploy, /home/deploy/.ssh/id_rsa]
    private_key_bad_permissions:
      - [a1, deploy, /home/deploy/.ssh/id_rsa]
    duplicate_key_across_users:
      - [null, null, K_DUP]
    key_on_many_hosts:
      - [null, null, K_FLEET]
    key_for_disabled_user:
      - [a2, backup, K_BACKUP]
    permit_root_login_yes:
      - [a2, null, null]
    password_authentication_yes:
      - [b2, null, null]
    known_host_stale:
      - [b1, admin, /home/admin/.ssh/known_hosts]
    partial_scan:
      - [b5, null, null]
    cert_authority_trusted:
      - [c2, root, K_CA]
  root_authorized_key_severity: high
  root_authorized_key_keys: {K_FLEET: 7, K_DSA: 2, K_ORPHAN: 1}
  parsing:
    k_ops_expiry_on_a1: "20991231"
    k_ops_private_encrypted: "yes"
    k_dsa_bits: 1024
  exports:
    access_edges_csv_rows: 20

scan2:
  changes:   # applied with lab/labctl.sh before the scan, outside the read-only brackets
    - [a5, scan2-a5]
    - [b2, scan2-b2]
    - [c2, scan2-c2]
  c2: [hostkey_mismatch]
  diff_1_2:
    edges_removed:
      - [jump:ops, a5:root, K_FLEET]
      - [b3:ops2, c2:svc, K_BRIDGE]
    edges_added:
      - [unknown, b2:www, K_NEW]
    keys_added: [K_NEW]
    keys_removed: [K_CA]
    findings_added:
      - [host_key_changed, c2, null, null]
      - [key_unknown_origin, b2, www, K_NEW]
    findings_removed:
      - [root_authorized_key, a5, root, K_FLEET]
      - [cert_authority_trusted, c2, root, K_CA]
    hosts_changed:
      - [c2, ok, hostkey_mismatch]

scan3:
  before: [hostkey accept 172.30.3.22]
  sudo_password: false
  hosts:
    c2: [ok]
    a4: [partial, unprivileged]
  a4_partial_scan_finding: true
  edge_absent: [unknown, a4:root, K_DSA]
