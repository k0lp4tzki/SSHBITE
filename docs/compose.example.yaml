# SSHBITE mit Docker Compose (docs/install.md, Pfad B).
#   0. Image zuerst bauen, im Wurzelverzeichnis des Repositorys:  docker build -t sshbite:0.1.0 .
#   1. /etc/sshbite/ auf dem Host enthält sshbite.yaml und den Audit-Schlüssel, Besitzer uid 10001, Modus 0600
#      (in der Konfiguration muss  database: /data/sshbite.db  stehen).
#   2. docker compose -f docs/compose.example.yaml up -d
#   3. docker exec -it sshbite sshbite config validate --connect
#   4. docker exec -it sshbite sshbite user add admin
#   5. docker exec sshbite sshbite scan
#   6. http://127.0.0.1:8722/ öffnen
services:
  sshbite:
    build: ..                 # das Wurzelverzeichnis des Repositorys; oder nur ein gebautes Image: image: sshbite:0.1.0
    image: sshbite:0.1.0
    container_name: sshbite
    restart: unless-stopped
    volumes:
      - sshbite-data:/data                  # Datenbank und ihre Kopien vor einer Aktualisierung
      - /etc/sshbite:/etc/sshbite:ro        # Konfiguration und Audit-Schlüssel, nur lesend
    ports:
      - "127.0.0.1:8722:8722"               # nur Loopback; die Oberfläche hat im Container kein TLS
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  sshbite-data:
